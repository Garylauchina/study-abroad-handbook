site_name: 海外大学留学手册
site_description: 面向中国大陆学生，按国家、大学和专业快速查询本科入学条件、国际生学费与毕业生情况。
site_url: https://garylauchina.github.io/study-abroad-handbook/
repo_url: https://github.com/Garylauchina/study-abroad-handbook
repo_name: GitHub
edit_uri: edit/main/docs/
theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  icon:
    logo: material/book-open-page-variant-outline
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.action.edit
hooks:
  - scripts/version_assets.py
  - scripts/catalog_search.py
plugins:
  - search:
      lang:
        - zh
        - en
      pipeline: []
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
extra_css:
  - assets/stylesheets/handbook.css
extra_javascript:
  - assets/javascripts/search-input.js
  - path: assets/javascripts/catalog.mjs
    type: module
  - path: assets/javascripts/budget.mjs
    type: module
extra:
  generator: false
# Programme pages are reached through their university list and catalogue search.
# Keeping them out of the global navigation avoids duplicating thousands of links on every page.
not_in_nav: |
  /catalog/*/*/*/index.md
