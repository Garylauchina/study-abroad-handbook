name: Validate and deploy handbook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Check source register
        run: python scripts/render_sources.py --check
      - name: Check sourced catalog and generated pages
        run: python scripts/render_catalog.py --check
      - name: Verify budget and catalog behavior
        run: node --test scripts/budget.test.mjs scripts/catalog.test.mjs
      - name: Verify asset versioning
        run: python scripts/version_assets_test.py
      - name: Build handbook
        run: mkdocs build --strict
      - name: Check links and search coverage
        run: python scripts/validate_site.py site
      - name: Verify Chinese and English searches
        run: node scripts/validate_search.mjs site
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
